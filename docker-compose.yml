# NEXUS Development Docker Compose Environment (Phase 03)
# Configures dedicated network, PostgreSQL + PostGIS database, and development containers.

networks:
  nexus-network:
    name: nexus-network
    driver: bridge

volumes:
  nexus-postgres-data:
    name: nexus-postgres-data

services:
  # Spatially Enabled PostgreSQL + PostGIS Database Service
  db:
    image: postgis/postgis:16-3.4
    container_name: nexus-db
    networks:
      - nexus-network
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Central API Service Container
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: nexus-api
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus-network
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://nexus:nexus_dev_password@db:5432/nexus_db}
    restart: unless-stopped

  # Command Center Dashboard Service Container
  command-center:
    build:
      context: .
      dockerfile: infrastructure/docker/command-center/Dockerfile
    container_name: nexus-command-center
    networks:
      - nexus-network
    ports:
      - "${COMMAND_CENTER_PORT:-3000}:3000"
    environment:
      - APP_ENV=${APP_ENV:-development}
    restart: unless-stopped

  # Field Officer PWA Service Container
  field-app:
    build:
      context: .
      dockerfile: infrastructure/docker/field-app/Dockerfile
    container_name: nexus-field-app
    networks:
      - nexus-network
    ports:
      - "${FIELD_APP_PORT:-3001}:3001"
    environment:
      - APP_ENV=${APP_ENV:-development}
    restart: unless-stopped
